services:
  redis:
    image: redis:7.2-alpine
    container_name: flowfin-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - flowfin-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowfin-app
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - /etc/flowfin/prod.env
    environment:
      REDIS_HOST: flowfin-redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - flowfin-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  redis-data:

networks:
  flowfin-network:
    driver: bridge
